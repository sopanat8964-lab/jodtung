<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จดตังค์</title>
<!-- ไอคอนและชื่อบนหน้าจอโฮม (iPhone / iPad / Android) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="จดตังค์">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3E9EF2">
<style>
  html, body { margin: 0; height: 100%; background: #E4F3FF; overflow: hidden; }
  #app { position: fixed; left: 0; right: 0; border: 0; width: 100%;
         top: env(safe-area-inset-top, 0px);
         height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            background: linear-gradient(180deg, #3E9EF2, #BDE6FF); color: #fff; font: 700 24px system-ui, sans-serif; transition: opacity .4s; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,40,120,.3); }
  #splash.hide { opacity: 0; pointer-events: none; }
  #help { display: none; font: 15px system-ui, sans-serif; text-align: center; max-width: 300px; }
  #help a { display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 99px; background: #FFC83D; color: #3A2A00; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <div id="splash">
    <img src="apple-touch-icon.png" alt="">
    <div>จดตังค์</div>
    <div id="help">ถ้าหน้าแอปไม่ขึ้นภายในไม่กี่วินาที แตะปุ่มด้านล่างเพื่อเปิดในเบราว์เซอร์<br><a id="openLink" href="#">เปิดจดตังค์</a></div>
  </div>
  <iframe id="app" title="จดตังค์" allow="clipboard-write; camera"></iframe>
  <script>
    // ⬇️ วางลิงก์ Web App ของคุณ (ลงท้ายด้วย /exec) ระหว่างเครื่องหมาย ' '
    var APP_URL = 'https://script.google.com/macros/s/xxxxxxxxxxxx/exec';

    var frame = document.getElementById('app');
    var splash = document.getElementById('splash');
    document.getElementById('openLink').href = APP_URL;
    frame.onload = function () { setTimeout(function () { splash.className = 'hide'; }, 300); };
    frame.src = APP_URL;
    setTimeout(function () { document.getElementById('help').style.display = 'block'; }, 8000);
  </script>
</body>
</html>
